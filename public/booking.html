<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookings | M-Cubed Lounge & Accommodation</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <a href="index.html">M-Cubed</a>

        <div>
          <a href="index.html">Home</a>
          <a href="booking.html">Booking</a>
          <a href="gallery.html">Gallery</a>
          <a href="contact.html">Contact</a>
        </div>

        <a href="booking.html">Book Now</a>
      </nav>
    </header>

    <main>
      <section class="page-hero">
        <p>PLAN YOUR EXPERIENCE</p>
        <h1>Make a Reservation</h1>

        <p>Reserve your accommodation or VIP table at M-Cubed.</p>
      </section>

      <section class="booking-section">
        <div class="section-heading">
          <p>ACCOMMODATION</p>
          <h2>Book a Room</h2>
        </div>

        <form id="roomBookingForm">
          <div class="form-group">
            <label for="roomName">Full Name</label>

            <input type="text" id="roomName" name="name" required />
          </div>

          <div class="form-group">
            <label for="roomEmail">Email Address</label>

            <input type="email" id="roomEmail" name="email" required />
          </div>

          <div class="form-group">
            <label for="roomName">Phone Number</label>

            <input type="tel" id="roomPhone" name="phone" required />
          </div>

          <div class="form-group">
            <label for="roomType">Room Type</label>

            <select id="roomType" name="roomType" required>
              <option value="">Select a room</option>
              <option value="deluxe">Deluxe Room</option>
              <option value="executive">Executive Room</option>
              <option value="suite">Suite</option>
            </select>
          </div>

          <div class="form-row">
            <div class="form-group">
                <label for="checkIn"> Check-in</label>
                <input type="date" id="checkIn" name="checkIn" required />
            </div>

          <div class="form-row">
            <div class="form-group">
                <label for="checkOut"> Check-out</label>
                <input type="date" id="checkOut" name="checkOut" required />
            </div>
          </div>

            <div class="form-group">
                <label for="guests">Number of guests</label>
                <input type="number" id="guests" name="guests" min="1" required />
            </div>
          <button type="submit">Submit Room Booking</button>
        </form>
      </section>

      <section class="booking-section">
        <div class="section-heading">
            <p>NIGHTLIFE</p>
            <h2>Reserve a VIP Table</h2>
        </div>

        <form id="tableBookingForm">
          <div class="form-group">
            <label for="tableName">Full Name</label>

            <input type="text" id="tableName" name="name" required />
          </div>

          <div class="form-group">
            <label for="tableName">Email Address</label>

            <input type="email" id="tableName" name="email" required />
          </div>

          <div class="form-group">
            <label for="tablePhone">Phone Number</label>

            <input type="tel" id="tablePhone" name="phone" required />
          </div>

          <div class="form-group">
            <label for="tableDate">Reservation Date</label>

            <input type="date" id="tableDate" name="date" required />
          </div>

          <div class="form-group">
            <label for="tableGuests">Number of Guests</label>

            <input type="number" id="tableGuests" name="guests" min="1" required />
          </div>

          <div class="form-group">
            <label for="tableMessage">Additional Information</label>

            <textArea id="tableMessage" name="message" rows="5"></textArea>
          </div>

          <button type="submit">Submit VIP Reservation</button>

        </form>
    </section>
    </main>

    <footer>
        <h3>M-Cubed</h3>
        <p>Lounge & Accommodation</p>
        <p>&copy; 2026 M-Cubed Lounge & Accommodation. All rights reserved.</p>
    </footer>

  </body>
</html>
