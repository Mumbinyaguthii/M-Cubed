<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookings | M-Cubed Lounge & Accommodation</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="logo">M-Cubed</div>

        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="booking.html">Booking</a></li>
          <li><a href="gallery.html">Gallery</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="booking.html" class="nav-button">Book Now</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="form-section">
        <div class="container">
          <div class="section-title">
            <h2>Accommodation Booking</h2>
            <p>Reserve your stay at M-Cubed.</p>
          </div>

          <div class="form-container">
            <form id="roomBookingForm">
              <div class="form-row">
                <div class="form-group">
                  <label for="roomName">Full Name</label>

                  <input type="text" id="roomName" name="name" />
                </div>

                <div class="form-group">
                  <label for="roomEmail">Email Address</label>

                  <input type="email" id="roomEmail" name="email" />
                </div>
              </div>

              <div class="form-group">
                <label for="roomPhone">Phone Number</label>

                <input type="tel" id="roomPhone" name="phone" />
              </div>

              <div class="form-group">
                <label for="roomType">Room Type</label>

                <select id="roomType" name="roomType" required>
                  <option value="">Select a room</option>
                  <option value="deluxe">Deluxe Room</option>
                  <option value="executive">Executive Room</option>
                  <option value="suite">Suite</option>
                </select>
              </div>

              <div class="form-group">
                <label for="checkIn"> Check-in</label>
                <input type="date" id="checkIn" name="checkIn" required />
              </div>

              <div class="form-group">
                <label for="checkOut"> Check-out</label>
                <input type="date" id="checkOut" name="checkOut" required />
              </div>

              <div class="form-group">
                <label for="guests">Number of guests</label>
                <input type="number" id="guests" name="guests" min="1" />
              </div>
              <button type="submit" class="btn btn-primary">
                Submit Room Booking
              </button>
            </form>
          </div>
        </div>
      </section>

      <section class="form-section">
        <div class="container">
          <div class="section-title">
            <h2>NIGHTLIFE</h2>
            <p>Reserve a VIP Table</p>
          </div>

          <div class="form-container">
            <form id="tableBookingForm">
              <div class="form-row">
                <div class="form-group">
                  <label for="tableName">Full Name</label>

                  <input type="text" id="tableName" name="name" />
                </div>

                <div class="form-group">
                  <label for="tableEmail">Email Address</label>

                  <input type="email" id="tableEmail" name="email" />
                </div>
              </div>

              <div class="form-group">
                <label for="tablePhone">Phone Number</label>

                <input type="tel" id="tablePhone" name="phone" />
              </div>

              <div class="form-group">
                <label for="tableDate">Reservation Date</label>

                <input type="date" id="tableDate" name="date" />
              </div>

              <div class="form-group">
                <label for="tableGuests">Number of Guests</label>

                <input type="number" id="tableGuests" name="guests" min="1" />
              </div>

              <div class="form-group">
                <label for="tableMessage">Additional Information</label>

                <textarea id="tableMessage" name="message" rows="5"></textarea>
              </div>

              <button type="submit" class="btn btn-primary">
                Submit VIP Reservation
              </button>
            </form>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <div>
        <h3>M-Cubed</h3>
        <p>Lounge & Accommodation</p>
      </div>

      <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="booking.html">Booking</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
      </div>

      <p>&copy; 2026 M-Cubed Lounge & Accommodation. All rights reserved</p>
    </footer>
  </body>
</html>
